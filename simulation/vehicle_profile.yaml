# Replace every value marked measured_* with flight-test measurements before
# using this profile for HIL or a real airframe.  The x500 values are only a
# transparent SITL baseline; they are not claimed to represent the user's UAV.
vehicle:
  upstream_x500_sitl_baseline:
    base_link_mass_kg: 2.0
    base_link_inertia_kg_m2: {ixx: 0.0216666667, iyy: 0.0216666667, izz: 0.04}
    motor:
      max_rot_velocity_rad_s: 1000
      motor_constant_N_s2: 8.54858e-06
      moment_constant: 0.016
      time_constant_up_s: 0.0125
      time_constant_down_s: 0.025
  measured_fields:
    mass_kg: null
    inertia_kg_m2: null
    motor_thrust_curve: null
    battery_discharge_curve: null
    battery_internal_resistance_ohm: null
